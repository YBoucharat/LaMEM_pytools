[project]
name = "git-lamem-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cmcrameri>=1.10",
    "dask>=2026.8.0",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "pyvista>=0.49.0",
    "scipy>=1.17.1",
    "vtk>=9.7.0",
    "xarray>=2026.7.0",
]

[project.scripts]
git-lamem-py = "git_lamem_py:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
